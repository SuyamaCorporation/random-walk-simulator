<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ランダムウォーク シミュレーター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    canvas { display: block; max-width: 100%; }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: #374151; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #6366f1; cursor: pointer; border: 2px solid #fff; }
  </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
  <div class="max-w-3xl mx-auto px-4 py-6">
    <!-- Header -->
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold text-indigo-300 mb-1">ランダムウォーク シミュレーター</h1>
      <p class="text-gray-400 text-sm">Random Walk Simulator — 2D Walk & Gambler's Ruin</p>
    </div>

    <!-- Mode selector -->
    <div class="flex justify-center gap-3 mb-4" role="group" aria-label="シミュレーションモード">
      <button id="mode-2d" onclick="setMode('2d')" class="px-5 py-2 rounded-full text-sm font-medium bg-indigo-600 text-white transition-colors">📐 2D ランダムウォーク</button>
      <button id="mode-gambler" onclick="setMode('gambler')" class="px-5 py-2 rounded-full text-sm font-medium bg-gray-700 text-gray-300 hover:bg-indigo-700 transition-colors">🎰 ギャンブラーの破産</button>
    </div>

    <!-- Canvas -->
    <div class="bg-gray-800 rounded-2xl p-3 mb-4 border border-gray-700 overflow-hidden">
      <canvas id="canvas" width="600" height="360" class="w-full rounded-xl bg-gray-950"></canvas>
    </div>

    <!-- Controls -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-4">
      <!-- 2D controls -->
      <div id="ctrl-2d" class="bg-gray-800 rounded-xl p-4 border border-gray-700 space-y-3">
        <h3 class="text-sm font-bold text-indigo-300">2D 設定</h3>
        <div>
          <label for="num-walkers" class="flex justify-between text-xs text-gray-400 mb-1">
            <span>ウォーカー数</span><span id="walkers-val" class="font-mono">3</span>
          </label>
          <input id="num-walkers" type="range" min="1" max="5" value="3" class="w-full" oninput="document.getElementById('walkers-val').textContent=this.value" />
        </div>
        <div>
          <label for="steps-frame" class="flex justify-between text-xs text-gray-400 mb-1">
            <span>ステップ/フレーム</span><span id="steps-val" class="font-mono">3</span>
          </label>
          <input id="steps-frame" type="range" min="1" max="20" value="3" class="w-full" oninput="document.getElementById('steps-val').textContent=this.value" />
        </div>
      </div>
      <!-- Gambler controls -->
      <div id="ctrl-gambler" class="bg-gray-800 rounded-xl p-4 border border-gray-700 space-y-3 hidden">
        <h3 class="text-sm font-bold text-yellow-300">ギャンブラー設定</h3>
        <div>
          <label for="start-capital" class="flex justify-between text-xs text-gray-400 mb-1">
            <span>初期資金（チップ数）</span><span id="capital-val" class="font-mono">50</span>
          </label>
          <input id="start-capital" type="range" min="10" max="200" value="50" class="w-full" oninput="document.getElementById('capital-val').textContent=this.value" />
        </div>
        <div>
          <label for="num-gamblers" class="flex justify-between text-xs text-gray-400 mb-1">
            <span>プレイヤー数</span><span id="gamblers-val" class="font-mono">3</span>
          </label>
          <input id="num-gamblers" type="range" min="1" max="5" value="3" class="w-full" oninput="document.getElementById('gamblers-val').textContent=this.value" />
        </div>
      </div>

      <!-- Speed + buttons -->
      <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 space-y-3">
        <h3 class="text-sm font-bold text-gray-300">速度</h3>
        <div>
          <label for="speed-slider" class="flex justify-between text-xs text-gray-400 mb-1">
            <span>フレームレート</span><span id="speed-val" class="font-mono">30 fps</span>
          </label>
          <input id="speed-slider" type="range" min="5" max="60" value="30" class="w-full" oninput="updateSpeed(this.value)" />
        </div>
      </div>

      <!-- Stats -->
      <div class="bg-gray-800 rounded-xl p-4 border border-gray-700">
        <h3 class="text-sm font-bold text-gray-300 mb-2">統計</h3>
        <div id="stats-panel" class="text-xs text-gray-400 space-y-1"></div>
      </div>
    </div>

    <!-- Play/Pause/Reset -->
    <div class="flex justify-center gap-3">
      <button id="btn-play" onclick="togglePlay()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-3 rounded-xl transition-colors">
        ▶ 再生
      </button>
      <button onclick="resetSim()" class="flex items-center gap-2 bg-gray-700 hover:bg-gray-600 text-gray-200 font-medium px-6 py-3 rounded-xl transition-colors">
        ↺ リセット
      </button>
    </div>
  </div>

  <script>
    const COLORS = ['#6366f1','#f59e0b','#10b981','#ef4444','#a855f7'];
    let mode = '2d';
    let running = false;
    let animId = null;
    let fps = 30;
    let lastTime = 0;
    let walkers = [];
    let totalSteps = 0;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function setMode(m) {
      mode = m;
      ['2d','gambler'].forEach(id => {
        const btn = document.getElementById('mode-' + id);
        const ctrl = document.getElementById('ctrl-' + id);
        if (id === m) { btn.classList.add('bg-indigo-600','text-white'); btn.classList.remove('bg-gray-700','text-gray-300'); ctrl.classList.remove('hidden'); }
        else { btn.classList.remove('bg-indigo-600','text-white'); btn.classList.add('bg-gray-700','text-gray-300'); ctrl.classList.add('hidden'); }
      });
      resetSim();
    }

    function updateSpeed(v) {
      fps = +v;
      document.getElementById('speed-val').textContent = v + ' fps';
    }

    function initWalkers() {
      walkers = [];
      totalSteps = 0;
      if (mode === '2d') {
        const n = +document.getElementById('num-walkers').value;
        for (let i = 0; i < n; i++) {
          walkers.push({ x: canvas.width / 2, y: canvas.height / 2, color: COLORS[i], steps: 0, trail: [{x: canvas.width/2, y: canvas.height/2}] });
        }
      } else {
        const n = +document.getElementById('num-gamblers').value;
        const cap = +document.getElementById('start-capital').value;
        for (let i = 0; i < n; i++) {
          walkers.push({ chips: cap, startChips: cap, color: COLORS[i], steps: 0, bankrupt: false, bankruptTime: null, history: [cap] });
        }
      }
    }

    function step2D() {
      const stepsPerFrame = +document.getElementById('steps-frame').value;
      walkers.forEach(w => {
        for (let s = 0; s < stepsPerFrame; s++) {
          const dir = Math.floor(Math.random() * 4);
          const d = 4;
          if (dir === 0) w.x += d; else if (dir === 1) w.x -= d;
          else if (dir === 2) w.y += d; else w.y -= d;
          w.x = Math.max(0, Math.min(canvas.width, w.x));
          w.y = Math.max(0, Math.min(canvas.height, w.y));
          w.steps++;
          w.trail.push({x: w.x, y: w.y});
          if (w.trail.length > 300) w.trail.shift();
        }
      });
      totalSteps++;
    }

    function stepGambler() {
      walkers.forEach(w => {
        if (w.bankrupt) return;
        const win = Math.random() < 0.5;
        w.chips += win ? 1 : -1;
        w.steps++;
        w.history.push(w.chips);
        if (w.history.length > canvas.width) w.history.shift();
        if (w.chips <= 0) { w.bankrupt = true; w.bankruptTime = w.steps; }
      });
      totalSteps++;
    }

    function draw2D() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      // Grid
      ctx.strokeStyle = '#1f2937';
      ctx.lineWidth = 0.5;
      for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
      for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }
      // Center marker
      ctx.strokeStyle = '#374151'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, canvas.height/2); ctx.lineTo(canvas.width, canvas.height/2); ctx.stroke();

      walkers.forEach(w => {
        if (w.trail.length < 2) return;
        ctx.strokeStyle = w.color + '80';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(w.trail[0].x, w.trail[0].y);
        w.trail.forEach(p => ctx.lineTo(p.x, p.y));
        ctx.stroke();
        // Current dot
        ctx.fillStyle = w.color;
        ctx.beginPath(); ctx.arc(w.x, w.y, 5, 0, Math.PI * 2); ctx.fill();
        // Glow
        ctx.fillStyle = w.color + '40';
        ctx.beginPath(); ctx.arc(w.x, w.y, 10, 0, Math.PI * 2); ctx.fill();
      });
    }

    function drawGambler() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const maxChips = +document.getElementById('start-capital').value * 2;
      walkers.forEach((w, wi) => {
        if (w.history.length < 2) return;
        const scaleY = (chips) => canvas.height - (chips / maxChips) * canvas.height * 0.9 - canvas.height * 0.05;
        ctx.strokeStyle = w.bankrupt ? w.color + '40' : w.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        w.history.forEach((chips, i) => {
          const x = (i / Math.max(w.history.length - 1, 1)) * canvas.width;
          const y = scaleY(chips);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();
        // Last value label
        const lastX = ((w.history.length - 1) / Math.max(w.history.length - 1, 1)) * canvas.width;
        const lastY = scaleY(w.chips);
        ctx.fillStyle = w.color;
        ctx.font = '11px monospace';
        ctx.fillText(w.bankrupt ? '💀' : w.chips + '枚', Math.min(lastX - 30, canvas.width - 50), lastY - 5);
      });
      // Zero line
      const zeroY = canvas.height - canvas.height * 0.05;
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(0, zeroY); ctx.lineTo(canvas.width, zeroY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#ef444480'; ctx.font = '11px monospace';
      ctx.fillText('破産ライン', 4, zeroY - 4);
    }

    function updateStats() {
      const panel = document.getElementById('stats-panel');
      let html = '';
      if (mode === '2d') {
        walkers.forEach((w, i) => {
          const dist = Math.round(Math.sqrt((w.x - canvas.width/2)**2 + (w.y - canvas.height/2)**2));
          html += `<div style="color:${w.color}">W${i+1}: (${Math.round(w.x-canvas.width/2)}, ${Math.round(canvas.height/2-w.y)}) 距離${dist}px ステップ${w.steps}</div>`;
        });
      } else {
        const bankrupt = walkers.filter(w => w.bankrupt).length;
        html += `<div class="text-yellow-300">破産: ${bankrupt}/${walkers.length}人</div>`;
        walkers.forEach((w, i) => {
          html += `<div style="color:${w.color}">P${i+1}: ${w.bankrupt ? '💀 破産 ('+w.bankruptTime+'手目)' : w.chips+'枚 ('+w.steps+'手目)'}</div>`;
        });
      }
      panel.innerHTML = html;
    }

    function loop(ts) {
      if (!running) return;
      const interval = 1000 / fps;
      if (ts - lastTime >= interval) {
        if (mode === '2d') { step2D(); draw2D(); }
        else { stepGambler(); drawGambler(); }
        updateStats();
        lastTime = ts;
      }
      animId = requestAnimationFrame(loop);
    }

    function togglePlay() {
      running = !running;
      const btn = document.getElementById('btn-play');
      if (running) { btn.innerHTML = '⏸ 一時停止'; btn.classList.replace('bg-indigo-600','bg-yellow-600'); animId = requestAnimationFrame(loop); }
      else { btn.innerHTML = '▶ 再生'; btn.classList.replace('bg-yellow-600','bg-indigo-600'); cancelAnimationFrame(animId); }
    }

    function resetSim() {
      if (running) togglePlay();
      initWalkers();
      if (mode === '2d') draw2D();
      else drawGambler();
      updateStats();
    }

    // Init
    initWalkers();
    draw2D();
    updateStats();
  </script>
</body>
</html>
